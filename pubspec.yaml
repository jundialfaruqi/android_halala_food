name: android_halala_food
description: "A new Flutter project."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.9.2

dependencies:
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.3
  dart_pusher_channels: 1.2.3
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.4
  flutter_tabler_icons: ^1.43.0
  geolocator: ^14.0.1
  go_router: ^17.2.3
  image: ^4.10.1
  image_picker: ^1.2.2
  intl: ^0.20.3
  latlong2: ^0.10.1
  package_info_plus: ^9.0.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  firebase_core: ^3.12.0
  firebase_messaging: ^15.2.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/
    - assets/images/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic-Variable.ttf
          style: italic

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_icon_foreground.png"
